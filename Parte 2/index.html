<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clínica Dental Sonrisa — Contacto</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header class="barra-superior">
    <div class="envoltorio">
      <h1 class="logo">Sonrisa</h1>

      <nav>
        <ul class="navegacion">
          <li><a class="enlace-nav" href="#">Inicio</a></li>
          <li><a class="enlace-nav" href="#">Servicios</a></li>
          <li><a class="enlace-nav" href="#">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>

    <div class="envoltorio">

      <h2 class="titulo-pagina">Contáctenos</h2>

      <p class="subtitulo">Respondemos todas las consultas el mismo día.</p>

      <div class="columnas">

        <section class="tarjeta-info">
          <h3>Dónde estamos</h3>

          <p class="dato">Avenida 8, calle 21, San José.</p>
          <p class="dato">Teléfono: 2256-4410</p>
          <p class="dato">Lunes a viernes de 8 a. m. a 6 p. m.</p>
          <p class="dato destacado">Urgencias: 8712-0045</p>
        </section>

        <form class="formulario">
          <h3>Escríbanos</h3>

          <div class="campo">
            <label class="etiqueta" for="nombre">Nombre completo</label>
            <input class="entrada" type="text" id="nombre" name="nombre">
          </div>

          <div class="campo">
            <label class="etiqueta" for="correo">Correo electrónico</label>
            <input class="entrada" type="email" id="correo" name="correo">
          </div>

          <div class="campo">
            <label class="etiqueta" for="motivo">Motivo de la consulta</label>
            <input class="entrada" type="text" id="motivo" name="motivo">
          </div>

          <button class="boton-enviar" type="submit">Enviar consulta</button>

        </form>

      </div>

    </div>

  </main>

  <footer class="pie-pagina">
    <div class="envoltorio"><p>Clínica Dental Sonrisa · San José, Costa Rica</p></div>
  </footer>

</body>
</html>
