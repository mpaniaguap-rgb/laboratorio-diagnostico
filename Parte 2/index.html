<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clínica Dental Sonrisa — Contacto</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header>
    <h1>Sonrisa</h1>
    <nav>
      <ul>
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Servicios</a></li>
        <li><a href="#">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Contáctenos</h2>
    <p>Respondemos todas las consultas el mismo día.</p>

    <section>
      <h3>Dónde estamos</h3>
      <p>Avenida 8, calle 21, San José.</p>
      <p>Teléfono: 2256-4410</p>
      <p>Lunes a viernes de 8 a. m. a 6 p. m.</p>
      <p>Urgencias: 8712-0045</p>
    </section>

    <form>
      <h3>Escríbanos</h3>

      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre">

      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" name="correo">

      <label for="motivo">Motivo de la consulta</label>
      <input type="text" id="motivo" name="motivo">

      <button type="submit">Enviar consulta</button>
    </form>
  </main>

  <footer>
    <p>Clínica Dental Sonrisa · San José, Costa Rica</p>
  </footer>

</body>
</html>
